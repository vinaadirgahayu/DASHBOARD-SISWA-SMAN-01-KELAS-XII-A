<style>

@page{size:A4 portrait;margin:8mm}
@media print{body{-webkit-print-color-adjust:exact;print-color-adjust:exact}.tabs,.bar input,#md,#tt,#a{display:none!important}.w{max-width:none;padding:0;zoom:.8}}

<script>

$("d").innerHTML=`<div class="k">${kp}</div><div class="note">${st}</div>
<div class="g" style="margin-top:0"><div class="c"><h2 class="l">TREN KEHADIRAN HARIAN BULAN INI</h2><div class="cb"><div class="ch">${bars}</div><div class="lb">${lb}</div><div class="lg">${lg}</div></div></div>

<div class="rk"><h2>RINGKASAN BULAN INI (s.d. tanggal laporan)</h2><div class="k">${mr}</div></div>`;
let h="<tr><th>No</th><th>Nama Siswa</th><th>JK</th>";for(let i=1;i<=30;i++)h+=`<th class="${wk(i)?"wk":""}${i==d?" sel":""}" style="cursor:pointer" data-d="${i}">${MG[dow(i)]}<br>${i}</th>`;h+="<th>H</th><th>S</th><th>I</th><th>A</th><th>% Hadir</th></tr>";

function stuM(i){const s=S[i],q=s[3].slice(0,cur),h=cnt(q,"H"),z=h+cnt(q,"S")+cnt(q,"I")+cnt(q,"A");let c='<div class="cal">'+MG.map(x=>`<div class="h">${x}</div>`).join("");
for(let d=1;d<=30;d++){const v=s[3][d-1],w=wk(d);if(d==1)c+='<div style="border:0"></div>'.repeat(dow(1));c+=`<div class="${w?"e":"g"}${d==cur?" sel":""}" ${w?"":`data-a="e:${i}:${d}:m"`} ${v in BG?`style="background:${BG[v][1]};color:${BG[v][0]}"`:""}><b>${d}</b>${v in BG?v:"&nbsp;"}</div>`}
modal(s[1],`<div>NIS ${s[0]} &middot; ${s[2]=="L"?"Laki-laki":"Perempuan"}</div><div class="sm"><span style="background:#C8E6C9;color:#1B5E20">Hadir ${h}</span><span style="background:#FFF59D;color:#7A5C00">Sakit ${cnt(q,"S")}</span><span style="background:#BBDEFB;color:#0D47A1">Izin ${cnt(q,"I")}</span><span style="background:#FFCDD2;color:#B71C1C">Alpa ${cnt(q,"A")}</span><span style="background:#eee">% Hadir ${z?Math.round(h/z*100):0}% (s.d. ${cur} Nov)</span></div>${c}</div><p style="color:#666">Klik tanggal untuk mengubah status: H, S, I, A, kosong. Dashboard ikut berubah.</p>`)}
function pctM(){const r=S.map((s,i)=>{const q=s[3].slice(0,cur),h=cnt(q,"H"),z=h+cnt(q,"S")+cnt(q,"I")+cnt(q,"A");return{i,q,h,p:z?h/z:0,z}}).sort((a,b)=>a.p-b.p||a.i-b.i);
modal("% Kehadiran per Siswa (s.d. "+cur+" Nov)",`<table><tr><th>No</th><th>Nama Siswa</th><th>H</th><th>S</th><th>I</th><th>A</th><th>% Hadir</th></tr>${r.map((x,k)=>`<tr><td class="c">${k+1}</td><td>${nm(x.i)}</td><td class="c">${x.h}</td><td class="c">${cnt(x.q,"S")}</td><td class="c">${cnt(x.q,"I")}</td><td class="c">${cnt(x.q,"A")}</td><td class="c"><b>${x.z?Math.round(x.p*100)+"%":"-"}</b></td></tr>`).join("")}</table>`)}
function rekapM(){let r="";for(let d=1;d<=cur;d++){if(wk(d))continue;const t=tally(d),n=sum(t);r+=`<tr class="cl" data-a="d:${d}" style="cursor:pointer"><td class="c">${d}</td><td class="c">${HN[dow(d)]}</td><td class="c">${t.H}</td><td class="c">${t.S}</td><td class="c">${t.I}</td><td class="c">${t.A}</td><td class="c">${n?Math.round(t.H/n*100)+"%":"-"}</td></tr>`}
modal("Rekap Harian s.d. "+cur+" Nov 2026",`<table><tr><th>Tgl</th><th>Hari</th><th>Hadir</th><th>Sakit</th><th>Izin</th><th>Alpa</th><th>% Hadir</th></tr>${r}</table><p style="color:#666">Klik baris untuk menjadikannya tanggal laporan.</p>`)}
function act(a){const [t,x,y,m]=a.split(":");
if(t=="k"){if(x=="P")return pctM();listM(x=="T"?"Semua Siswa":x=="X"?"Siswa Tidak Hadir":"Siswa "+NM[x],idx(i=>x=="T"||(x=="X"?"SIA".includes(S[i][3][cur-1]):S[i][3][cur-1]==x)))}
else if(t=="g")listM(x=="L"?"Siswa Laki-laki":"Siswa Perempuan",idx(i=>S[i][2]==x));
else if(t=="s")stuM(+x);
else if(t=="e"){const i=+x,d=+y,o="HSIA.",s=S[i][3];S[i][3]=s.slice(0,d-1)+o[(o.indexOf(s[d-1])+1)%5]+s.slice(d);touched=true;render();if(m)stuM(i)}
else if(t=="d"){cur=+x;touched=true;render();close()}
else if(t=="r")rekapM();
else if(t=="dt"){try{$("dt").showPicker()}catch(e){$("dt").focus()}}}
document.addEventListener("click",e=>{if(e.target.id=="md"||e.target.id=="mx")return close();
const a=e.target.closest("[data-a]");if(a)return act(a.dataset.a);
const d=e.target.closest("[data-d]");if(d){cur=+d.dataset.d;touched=true;render()}});
document.addEventListener("keydown",e=>{if(e.key=="Escape")close()});
document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>{document.querySelectorAll(".tabs button").forEach(x=>x.classList.toggle("on",x==b));$("d").hidden=b.dataset.v!="d";$("a").hidden=b.dataset.v!="a"});
$("dt").onchange=e=>{const v=+e.target.value.slice(8);if(v){cur=v;touched=true;render()}};
document.addEventListener("mousemove",e=>{const d=e.target.closest&&e.target.closest(".ch [data-d]"),t=$("tt");if(d){const n=+d.dataset.d,x=tally(n);t.style.display="block";t.style.left=e.clientX+12+"px";t.style.top=e.clientY+12+"px";t.textContent=`${HN[dow(n)]}, ${n} Nov - Hadir ${x.H} | Sakit ${x.S} | Izin ${x.I} | Alpa ${x.A}`}else t.style.display="none"});
render();
</script></body></html>
